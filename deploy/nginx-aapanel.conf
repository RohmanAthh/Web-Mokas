# Tambahan konfigurasi Nginx untuk situs di aaPanel.
# aaPanel → Website → (domain Anda) → Conf / Config file.
# Tempel DI DALAM blok `server { ... }` yang untuk port 443 (setelah SSL aktif),
# atau ganti blok reverse proxy yang dibuat otomatis oleh menu "Reverse proxy".

# Upload foto mobil (hingga ±45 MB per simpan)
client_max_body_size 50m;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_buffering off;
}

# Aset statis Next.js (nama file berisi hash → aman di-cache lama)
location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Jangan pernah sajikan file database/backup secara langsung
location ~* \.(db|db-wal|db-shm|sqlite)$ {
    deny all;
}
